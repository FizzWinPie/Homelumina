    <line x1="60" y1="95" x2="60" y2="105"/>
    <line x1="46" y1="75" x2="36" y2="75"/>
    <line x1="74" y1="75" x2="84" y2="75"/>
    <line x1="50" y1="65" x2="42" y2="57"/>
    <line x1="70" y1="65" x2="78" y2="57"/>
    <line x1="50" y1="85" x2="42" y2="93"/>
    <line x1="70" y1="85" x2="78" y2="93"/>
  </g>
</svg> 