# Prometheus config for Docker. Scrapes the app on the host.
# Your app should be running on the host (e.g. npm run dev in server/) on port 3000.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: homelumina
    static_configs:
      # On Mac/Windows Docker Desktop: host.docker.internal = host machine
      - targets: ["host.docker.internal:3000"]
    metrics_path: /metrics
    scrape_interval: 15s
